# ============================================================================
# DeerFlow Configuration
# ============================================================================

# ============================================================================
# MCP Servers (AIO Sandbox + Vale-MCP + QWED)
# ============================================================================
mcp_servers:
  - name: aio-sandbox
    url: "http://host.docker.internal:8090/mcp"     # ← This gives you Vale-MCP, file tools, bash, etc.

  # Optional: QWED MCP tool (if you enabled the QWED MCP server on port 8091)
  - name: qwed
    url: "http://host.docker.internal:8091"

# ============================================================================
# Models Configuration
# ============================================================================
# Configure available LLM models for the agent to use

models:
  - name: local-qwen
    display_name: "Qwen3 4B (Local + QWED Verified)"
    use: langchain_ollama:ChatOllama
    model: qwen3:4b-q4_K_M
    base_url: http://host.docker.internal::8001/v1 # ← QWED Gateway (recommended)

  # Optional: faster model for summarization / light tasks
  # - name: local-qwen-fast
  #   display_name: "Qwen3 1.7B (Fast)"
  #   use: langchain_ollama:ChatOllama
  #   model: qwen3:1.7b-q4_K_M
  #   base_url: http://host.docker.internal:11434

# ============================================================================
# Tool Groups Configuration
# ============================================================================
# Define groups of tools for organization and access control

tool_groups:
  - name: web
  - name: file:read
  - name: file:write
  - name: bash
  - name: verification

# ============================================================================
# Tools Configuration
# ============================================================================
# Configure available tools for the agent to use

tools:
  # ---------------------------------------------------------------------------
  # Web search — SearXNG (local, private, no API key needed)
  # Requires: deer-flow/backend/src/community/searxng/tools.py (custom wrapper)
  # Set in .env: SEARXNG_URL=http://host.docker.internal:8080
  # ---------------------------------------------------------------------------
  - name: web_search
    group: web
    use: src.community.searxng.tools:web_search_tool
    max_results: 8

  # ---------------------------------------------------------------------------
  # Web fetch — AIO Sandbox browser (local, no cloud dependency)
  # Uses AIO Sandbox's built-in fetch/browse tool via its MCP hub
  # Replaces Jina AI (cloud) with your local AIO Sandbox container
  # ---------------------------------------------------------------------------
  - name: web_fetch
    group: web
    use: src.community.aio_sandbox.tools:web_fetch_tool
    timeout: 20

  # ---------------------------------------------------------------------------
  # Image search — DuckDuckGo (free, no API key)
  # Used by agents to find reference images before generating or embedding them
  # ---------------------------------------------------------------------------
  - name: image_search
    group: web
    use: src.community.image_search.tools:image_search_tool
    max_results: 5

  # File operations tools (AIO Sandbox)
  - name: ls
    group: file:read
    use: src.sandbox.tools:ls_tool

  - name: read_file
    group: file:read
    use: src.sandbox.tools:read_file_tool

  - name: write_file
    group: file:write
    use: src.sandbox.tools:write_file_tool

  - name: str_replace
    group: file:write
    use: src.sandbox.tools:str_replace_tool

  # Bash execution tool
  - name: bash
    group: bash
    use: src.sandbox.tools:bash_tool

# QWED Verification Tool (MCP)
  # - name: qwed_verify
  #   group: verification
  #   use: src.community.qwed.tools:qwed_verify_tool   # adjust if your wrapper path is different
    # Alternative if using raw MCP endpoint:
    # url: "http://host.docker.internal:8091"

# ============================================================================
# Sandbox Configuration — AIO Sandbox (Docker container)
# ============================================================================

sandbox:
  use: src.community.aio_sandbox:AioSandboxProvider
  aio_sandbox_url: "http://host.docker.internal:8090"  

# ============================================================================
# Subagents Configuration
# ============================================================================
# Configure timeouts for subagent execution
# Subagents are background workers delegated tasks by the lead agent

subagents:
  timeout_seconds: 600  # 10 min default (vs 15 min default) — adjust to taste
  agents:
    bash:
      timeout_seconds: 180   # 3 min for shell commands
    general-purpose:
      timeout_seconds: 600   # 10 min for research tasks

# ============================================================================
# Skills Configuration
# ============================================================================
# Configure skills directory for specialized agent workflows

skills:
  container_path: /mnt/skills

# ============================================================================
# Title Generation Configuration
# ============================================================================
# Automatic conversation title generation settings

title:
  enabled: true
  max_words: 6
  max_chars: 60
  model_name: null # Use default model (first model in models list)

# ============================================================================
# Summarization Configuration
# ============================================================================
# Automatically summarize conversation history when token limits are approached
# This helps maintain context in long conversations without exceeding model limits

summarization:
  enabled: true
  model_name: null
  trigger:
    # Trigger when token count reaches 15564
    - type: tokens
      value: 8000    # reduced from 15564 — safer for local models with 4096 ctx window
  keep:
    # Keep the most recent 10 messages (recommended)
    type: messages
    value: 10

  # Maximum tokens to keep when preparing messages for summarization
  # Set to null to skip trimming (not recommended for very long conversations)
  trim_tokens_to_summarize: 8000

  # Custom summary prompt template (null = use default LangChain prompt)
  # The prompt should guide the model to extract important context
  summary_prompt: null

# ============================================================================
# Memory Configuration
# ============================================================================
# Global memory mechanism
# Stores user context and conversation history for personalized responses
memory:
  enabled: true
  storage_path: memory.json # Path relative to backend directory
  debounce_seconds: 30 # Wait time before processing queued updates
  model_name: null # Use default model
  max_facts: 100 # Maximum number of facts to store
  fact_confidence_threshold: 0.7 # Minimum confidence for storing facts
  injection_enabled: true # Whether to inject memory into system prompt
  max_injection_tokens: 1000  # reduced from 2000 — leaves more room for context on local models

# ============================================================================
# Checkpointer Configuration
# ============================================================================
# Configure state persistence for the embedded DeerFlowClient.
# The LangGraph Server manages its own state persistence separately
# via the server infrastructure (this setting does not affect it).
#
# When configured, DeerFlowClient will automatically use this checkpointer,
# enabling multi-turn conversations to persist across process restarts.
#
# SQLite (file-based, single-process):
# SQLite persists conversations across restarts
# Good choice for local use — no extra Postgres container needed.
# Conversation state survives Docker restarts.
checkpointer:
  type: sqlite
  connection_string: checkpoints.db

